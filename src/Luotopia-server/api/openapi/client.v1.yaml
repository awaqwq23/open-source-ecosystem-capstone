openapi: 3.1.0
info:
  title: Luotopia Client API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /pull:
    post:
      summary: Authenticated unified pull
      responses:
        "200":
          description: Unified pull response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
  /pull/public:
    post:
      summary: Public unified pull
      responses:
        "200":
          description: Public unified pull response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullResponse"
  /hot-update/scripts/{name}/content:
    get:
      summary: Download current enabled hot-update script content
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: JavaScript content.
          content:
            application/javascript:
              schema:
                type: string
components:
  schemas:
    ApiLink:
      type: object
      required:
        - href
      properties:
        href:
          type: string
          description: Relative API path owned by the resource producer module.
    PullResponse:
      type: object
      properties:
        hot_update:
          type: object
          properties:
            scripts:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ScriptVersion"
        school_timetable:
          type: object
          properties:
            changed:
              type: boolean
            latest_version:
              type: integer
              format: int64
            checksum:
              type: string
            schema_version:
              type: integer
            terms:
              type: array
              items:
                type: string
            changes:
              type: array
              items:
                $ref: "#/components/schemas/SchoolTimetableChange"
            published_at:
              type: string
              format: date-time
    ScriptVersion:
      type: object
      required:
        - latest_version
        - checksum
      properties:
        changed:
          type: boolean
        latest_version:
          type: integer
        checksum:
          type: string
        links:
          type: object
          properties:
            content:
              $ref: "#/components/schemas/ApiLink"
    SchoolTimetableChange:
      type: object
      required:
        - version
        - sequence
        - operation
        - entity_type
        - entity_id
      properties:
        version:
          type: integer
          format: int64
        sequence:
          type: integer
        operation:
          type: string
          enum: [upsert, delete]
        entity_type:
          type: string
        entity_id:
          type: string
        term_key:
          type: string
        payload:
          type: object
          additionalProperties: true
