services:
  server:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./configs/.env
    volumes:
      - ./configs/.env:/app/configs/.env:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  migrate:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/luotopia-migrate"]
    env_file:
      - ./configs/.env
    volumes:
      - ./configs/.env:/app/configs/.env:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: luotopia
      POSTGRES_USER: luotopia
      POSTGRES_PASSWORD: luotopia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - luotopia-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luotopia -d luotopia"]
      interval: 10s
      timeout: 3s
      retries: 6

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  luotopia-postgres-data:
