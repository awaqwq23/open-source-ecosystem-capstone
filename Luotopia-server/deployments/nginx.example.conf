# ============================================================
# Luotopia Nginx 配置
# ============================================================
# 部署说明：
#   1. 主站静态文件直接使用仓库内位置：
#      /home/projects/Luotopia/Luotopia-website
#      更新方式：服务器上 git pull 即可
#   2. api.luotopia.cn → 反代到 Go 后端 (127.0.0.1:8080)
#   3. luotopia.cn → 静态文件服务 (Luotopia 主站)
#
# ⚠️ ICP 备案提醒：
#   源站在中国大陆（阿里云上海），未备案域名的公网访问会被
#   阿里云在网络边界按 Host 拦截（返回 Non-compliance ICP Filing）。
#   这与域名后缀、是否经 Cloudflare 无关——CF 回源仍打到大陆服务器。
#   luotopia.cn 须完成 ICP 备案后，公网才能正常访问本配置。
#   备案通过后用 certbot 申请证书：
#     certbot --nginx -d luotopia.cn -d www.luotopia.cn
# ============================================================

upstream luotopia_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── API 服务 ─────────────────────────────────────────────
server {
    listen 80;
    server_name api.luotopia.cn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://luotopia_server;
    }

    location ^~ /api/v1/ {
        proxy_pass http://luotopia_server;
    }

    location ^~ /admin/api/v1/ {
        proxy_pass http://luotopia_server;
    }

    location = /admin {
        proxy_pass http://luotopia_server;
    }

    location ^~ /admin/ {
        proxy_pass http://luotopia_server;
    }
}

# ── 主站静态文件 ─────────────────────────────────────────
# Cloudflare Flexible 模式: 用户↔CF走HTTPS, CF↔源站走HTTP
server {
    listen 80;
    listen [::]:80;
    server_name luotopia.cn www.luotopia.cn;

    # 直接使用仓库内位置，git pull 即可更新
    root /home/projects/Luotopia/Luotopia-website;
    index index.html;

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 子路径路由 (如 /download/, /about/)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
