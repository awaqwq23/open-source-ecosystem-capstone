# ============================================================
# Luotopia Nginx 配置
# ============================================================
# 部署说明：
#   1. 将静态网站文件放置于 /var/www/luotopia/
#   2. api.luotopia.cn → 反代到 Go 后端 (127.0.0.1:8080)
#   3. luotopia.cn → 静态文件服务 (Luotopia 主站)
# ============================================================

upstream luotopia_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── API 服务 ─────────────────────────────────────────────
server {
    listen 80;
    server_name api.luotopia.cn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://luotopia_server;
    }

    location ^~ /api/v1/ {
        proxy_pass http://luotopia_server;
    }

    location ^~ /admin/api/v1/ {
        proxy_pass http://luotopia_server;
    }

    location = /admin {
        proxy_pass http://luotopia_server;
    }

    location ^~ /admin/ {
        proxy_pass http://luotopia_server;
    }
}

# ── 主站静态文件 ─────────────────────────────────────────
server {
    listen 80;
    server_name luotopia.cn www.luotopia.cn;

    root /var/www/luotopia;
    index index.html;

    # 静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 子路径路由 (如 /download/, /about/)
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
