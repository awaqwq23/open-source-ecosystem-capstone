<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luotopia 管理后台</title>
    <link rel="stylesheet" href="/admin/assets/styles.css" />
  </head>
  <body>
    <main id="login" class="login-shell">
      <section class="login-panel">
        <p class="eyebrow">Luotopia Admin</p>
        <h1>管理后台</h1>
        <p class="muted">使用独立后台管理员账号登录，与 Luotopia 用户账号互不影响。</p>
        <form id="login-form" class="form-grid">
          <label>
            管理员账号
            <input id="login-identifier" autocomplete="username" placeholder="admin" required />
          </label>
          <label>
            密码
            <input id="login-password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primary" type="submit">登录后台</button>
        </form>
      </section>
    </main>

    <main id="app" class="app-shell hidden">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Luotopia</p>
          <h1>管理后台</h1>
        </div>
        <nav id="nav">
          <button data-view="dashboard" class="active">仪表盘</button>
          <button data-view="notifications">通知</button>
          <button data-view="weather">天气</button>
          <button data-view="scripts">热更新脚本</button>
          <button data-view="sync">同步白名单</button>
          <button data-view="users">用户</button>
        </nav>
        <button id="logout" class="ghost">退出登录</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p id="view-kicker" class="eyebrow">Dashboard</p>
            <h2 id="view-title">仪表盘</h2>
          </div>
          <button id="refresh" class="secondary">刷新</button>
        </header>
        <p id="message" class="message hidden"></p>
        <section id="content"></section>
      </section>
    </main>

    <script src="/admin/assets/app.js"></script>
  </body>
</html>
