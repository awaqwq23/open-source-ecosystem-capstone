name: Course build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: src/Luotopia-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - name: Prepare example configuration
        run: cp .env.example .env
      - name: Install dependencies
        run: flutter pub get
      - name: Run app tests
        run: flutter test
      - name: Build demo APK
        run: flutter build apk --debug
